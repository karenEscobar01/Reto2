<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Académica - Notas de Certámenes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main-container">
    <div class="card">
      <form id="student-form">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" placeholder="Ingrese el nombre" required>
        </div>

        <div class="form-group">
          <label for="c1">Certamen 1:</label>
          <input type="number" id="c1" min="10" max="100" placeholder="Nota 10 - 100" required>
        </div>

        <div class="form-group">
          <label for="c2">Certamen 2:</label>
          <input type="number" id="c2" min="10" max="100" placeholder="Nota 10 - 100" required>
        </div>

        <div class="form-group">
          <label for="c3">Certamen 3:</label>
          <input type="number" id="c3" min="10" max="100" placeholder="Nota 10 - 100" required>
        </div>

        <button type="submit" id="btn-submit">Agregar Alumno</button>
      </form>
      <div id="message" class="message hidden"></div>
    </div>
    <div id="results-card" class="card hidden">
      <div id="results-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
